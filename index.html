<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>企鹅的每日计划</title>
  <style>
    :root {
      --ink: #161616;
      --muted: #858585;
      --soft: #f4f4f2;
      --line: #dededb;
      --paper: #fbfbfa;
      --panel: #ffffff;
      --shadow: 0 24px 60px rgba(20, 20, 20, .09), 0 2px 8px rgba(20, 20, 20, .04);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 15px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--soft);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: .01em;
    }

    body::before {
      content: "";
      position: fixed;
      width: 50vw;
      height: 50vw;
      max-width: 640px;
      max-height: 640px;
      top: -25vw;
      right: -14vw;
      background: radial-gradient(circle, rgba(255,255,255,.98), rgba(255,255,255,0));
      pointer-events: none;
    }

    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 52px; position: relative; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 34px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; letter-spacing: .08em; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--ink); font-size: 17px; transform: rotate(-5deg); box-shadow: 0 5px 15px rgba(0,0,0,.15); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .history-actions { display: flex; align-items: center; gap: 5px; }
    .history-button { border: 1px solid var(--line); border-radius: 99px; color: #777773; background: rgba(255,255,255,.5); padding: 8px 11px; font-size: 12px; transition: background .2s, color .2s, border .2s; }
    .history-button:hover:not(:disabled) { color: var(--ink); border-color: #bdbdb9; background: #fff; }
    .history-button:disabled { color: #b8b8b4; background: rgba(255,255,255,.3); cursor: not-allowed; }
    .date-chip { color: var(--muted); font-size: 13px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255,255,255,.5); }

    .layout { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(330px, .94fr); gap: 22px; align-items: start; }
    .panel { border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.76); border-radius: var(--radius-xl); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .main-panel { padding: clamp(28px, 5vw, 58px); min-height: 620px; display: flex; flex-direction: column; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 21px; }
    .question { font-size: clamp(30px, 4.2vw, 52px); line-height: 1.12; letter-spacing: -.055em; margin: 0; max-width: 620px; font-weight: 700; }
    .question em { font-style: normal; color: #a3a3a0; }
    .subcopy { color: var(--muted); margin: 17px 0 0; font-size: 14px; line-height: 1.8; max-width: 480px; }
    .step { display: none; animation: slideIn .38s ease both; flex: 1; flex-direction: column; }
    .step.active { display: flex; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .story-input { flex: 1; min-height: 190px; margin-top: 44px; resize: none; border: 0; border-bottom: 1px solid var(--line); padding: 0 0 16px; background: transparent; outline: none; font-size: 21px; line-height: 1.65; color: var(--ink); }
    .story-input::placeholder { color: #b7b7b3; }
    .story-input:focus { border-color: var(--ink); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 30px; }
    .hint { color: var(--muted); font-size: 12px; }
    .primary { border: 0; border-radius: 99px; color: #fff; background: var(--ink); padding: 14px 22px; font-weight: 650; font-size: 14px; box-shadow: 0 8px 18px rgba(0,0,0,.13); transition: transform .2s, box-shadow .2s; }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 12px 23px rgba(0,0,0,.18); }
    .secondary { border: 1px solid var(--line); color: var(--ink); background: rgba(255,255,255,.65); border-radius: 99px; padding: 13px 18px; font-weight: 600; transition: background .2s; }
    .secondary:hover { background: #fff; }

    .group-builder { margin-top: 35px; display: flex; flex-direction: column; gap: 13px; }
    .group { position: relative; border: 1px solid var(--line); background: rgba(255,255,255,.6); border-radius: var(--radius-lg); padding: 17px; }
    .group-head { position: relative; display: flex; align-items: center; gap: 9px; }
    .group-head input { flex: 1; min-width: 0; border: 0; outline: 0; font-weight: 700; font-size: 16px; background: transparent; color: var(--ink); }
    .group-head input::placeholder { color: #b7b7b3; }
    .group-menu-toggle { width: 28px; height: 28px; border: 0; border-radius: 9px; color: #777773; background: transparent; display: grid; place-items: center; font-size: 21px; line-height: 1; letter-spacing: 2px; padding: 0 0 7px 2px; transition: background .2s, color .2s; }
    .group-menu-toggle:hover, .group.menu-open .group-menu-toggle { color: var(--ink); background: #ededeb; }
    .group-menu { display: none; position: absolute; z-index: 3; top: 50px; right: 17px; width: 150px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.97); box-shadow: 0 15px 35px rgba(20,20,20,.12); }
    .group.menu-open .group-menu { display: grid; gap: 2px; }
    .group-menu button { border: 0; border-radius: 9px; background: transparent; color: #696966; text-align: left; padding: 9px 10px; font-size: 12px; }
    .group-menu button:hover { color: var(--ink); background: #f0f0ee; }
    .tasks { display: grid; gap: 8px; margin-top: 15px; }
    .task-row { display: flex; align-items: center; gap: 9px; min-height: 32px; }
    .check { appearance: none; width: 20px; height: 20px; margin: 0; border: 1.5px solid #bcbcb8; border-radius: 7px; background: #fff; flex: 0 0 auto; position: relative; transition: all .2s; }
    .check:checked { background: var(--ink); border-color: var(--ink); }
    .check:checked::after { content: "✓"; color: #fff; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
    .task-input { flex: 1; min-width: 0; border: 0; outline: 0; border-bottom: 1px solid transparent; font-size: 14px; background: transparent; color: var(--ink); padding: 5px 0; }
    .task-input:focus { border-bottom-color: var(--line); }
    .task-row.done .task-input { color: #a0a09c; text-decoration: line-through; }
    .task-note { color: #858581; font-size: 11px; white-space: nowrap; }
    .delete-task { display: none; border: 0; width: auto; height: auto; padding: 0 2px; color: #989894; background: transparent; font-size: 18px; line-height: 1; }
    .delete-task:hover { color: var(--ink); }
    .group.manage-mode .delete-task { display: inline-grid; }
    .add-task { margin-top: 13px; border: 0; background: none; color: #888884; font-size: 12px; padding: 4px 0; text-align: left; }
    .add-task:hover { color: var(--ink); }
    .add-group { margin-top: 2px; border: 1px dashed #bdbdb9; color: #696966; background: transparent; border-radius: var(--radius-lg); padding: 16px; width: 100%; font-size: 13px; transition: border .2s, background .2s; }
    .add-group:hover { background: rgba(255,255,255,.75); border-color: var(--ink); }

    .side-panel { padding: 28px; position: sticky; top: 20px; }
    .side-title { display: flex; justify-content: space-between; align-items: start; margin-bottom: 23px; }
    .side-title h2 { font-size: 18px; margin: 0; letter-spacing: -.03em; }
    .side-title span { color: var(--muted); font-size: 12px; }
    .progress-wrap { padding: 17px; border-radius: var(--radius-lg); background: #f1f1ef; margin-bottom: 22px; }
    .progress-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 13px; }
    .progress-label strong { font-size: 30px; letter-spacing: -.06em; }
    .progress-label span { color: var(--muted); font-size: 12px; }
    .progress-track { height: 6px; border-radius: 99px; background: #dddcd8; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; border-radius: inherit; background: var(--ink); transition: width .35s ease; }
    .plan-summary { display: grid; gap: 10px; }
    .summary-empty { color: #a3a39f; font-size: 13px; line-height: 1.7; padding: 17px 2px; }
    .summary-group { padding: 14px 0 3px; border-bottom: 1px solid #ecece9; }
    .summary-group:last-child { border-bottom: 0; }
    .summary-group-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
    .summary-count { color: var(--muted); font-size: 11px; font-weight: 500; }
    .summary-task-row { display: block; margin-top: 7px; }
    .summary-task { flex: 1; min-width: 0; color: #6d6d69; font-size: 12px; line-height: 1.7; display: flex; gap: 7px; }
    .summary-task::before { content: "·"; color: #aaa; }
    .summary-task.done { color: #b2b2ae; text-decoration: line-through; }
    .summary-task.done::before { content: "✓"; color: var(--ink); }
    .summary-note { margin: 5px 0 0 18px; color: #8a8a86; font-size: 11px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; }
    .summary-note:hover { color: var(--ink); }
    .summary-files { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0 0 18px; }
    .summary-file { width: 25px; height: 25px; border: 0; border-radius: 50%; color: #777773; background: #ededeb; display: grid; place-items: center; font-size: 12px; cursor: pointer; }
    .summary-file:hover { color: #fff; background: var(--ink); }
    .summary-file:disabled { color: #aaa; background: #e2e2df; cursor: help; }
    .save-note { display: flex; gap: 9px; align-items: center; border-top: 1px solid #ecece9; margin-top: 22px; padding-top: 20px; color: #888884; font-size: 12px; }
    .save-note::before { content: "↳"; font-size: 18px; color: var(--ink); }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,15,15,.3); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(470px, 100%); background: #fbfbfa; border-radius: 27px; box-shadow: 0 30px 90px rgba(0,0,0,.22); padding: 28px; animation: pop .25s ease both; }
    @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal h3 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
    .modal p { color: var(--muted); line-height: 1.7; font-size: 13px; margin: 9px 0 20px; }
    .note-textarea { display: block; width: 100%; min-height: 104px; resize: vertical; border: 1px solid var(--line); border-radius: 17px; outline: 0; padding: 13px 15px; color: var(--ink); background: #f7f7f5; line-height: 1.65; font-size: 13px; margin-bottom: 12px; }
    .note-textarea:focus { border-color: var(--ink); background: #fff; }
    .note-textarea::placeholder { color: #aaa9a5; }
    .file-tools { display: flex; align-items: center; gap: 8px; min-height: 30px; }
    .file-drop { width: 30px; height: 30px; border: 1px solid #c7c7c3; border-radius: 50%; display: grid; place-items: center; color: #777773; background: #f0f0ee; font-size: 17px; line-height: 1; cursor: pointer; transition: background .2s, border .2s, color .2s; }
    .file-drop:hover { color: #fff; background: var(--ink); border-color: var(--ink); }
    .file-drop strong { display: block; font-weight: 400; transform: translateY(-1px); }
    .file-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .file-item { display: inline-flex; }
    .file-name { display: none; }
    .file-open { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; color: #777773; background: #ededeb; display: grid; place-items: center; font-size: 12px; cursor: pointer; }
    .file-open:hover { color: #fff; background: var(--ink); }
    .file-open:disabled { color: #aaa; background: #e2e2df; cursor: help; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 23px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 17px; color: #fff; background: var(--ink); border-radius: 99px; font-size: 12px; transition: all .25s; z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 800px) {
      .app { width: min(100% - 24px, 620px); padding-top: 22px; }
      .layout { grid-template-columns: 1fr; }
      .main-panel { min-height: 570px; padding: 28px 23px; }
      .side-panel { position: static; padding: 23px; }
      .story-input { min-height: 180px; margin-top: 34px; }
      .question { font-size: 38px; }
      .topbar { margin-bottom: 20px; }
    }
    @media (max-width: 440px) {
      .date-chip { display: none; }
      .history-button { width: 32px; height: 30px; padding: 0; font-size: 0; }
      #undo-action::before { content: "↶"; font-size: 17px; }
      #redo-action::before { content: "↷"; font-size: 17px; }
      .actions { align-items: stretch; flex-direction: column-reverse; }
      .primary, .secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">♟</span><span>DAILY / PENGUIN</span></div>
      <div class="topbar-right">
        <div class="history-actions" aria-label="历史操作">
          <button class="history-button" id="undo-action" disabled title="撤回上一步">↶ 撤回上一步</button>
          <button class="history-button" id="redo-action" disabled title="回到下一步">↷ 回到下一步</button>
        </div>
        <div class="date-chip" id="today"></div>
      </div>
    </header>

    <div class="layout">
      <section class="panel main-panel">
        <div class="step active" id="step-one">
          <div class="eyebrow">01 / 今日意图</div>
          <h1 class="question">亲爱的企鹅，<br><em>你今天的计划是什么？</em></h1>
          <p class="subcopy">先写下此刻脑海里最想完成的事。不用太具体，给今天一个方向就好。</p>
          <textarea id="story" class="story-input" placeholder="例如：想专注工作，也留一点时间给自己……" maxlength="240"></textarea>
          <div class="actions"><span class="hint">可以随时回来修改</span><button class="primary" id="to-step-two">继续，写下细节 <span>→</span></button></div>
        </div>

        <div class="step" id="step-two">
          <div class="eyebrow">02 / 具体事项</div>
          <h1 class="question">请你写下<br><em>具体事项吧。</em></h1>
          <p class="subcopy">把大方向拆成几个小组，每一件小事都值得被认真完成。</p>
          <div id="group-builder" class="group-builder"></div>
          <div class="actions"><button class="secondary" id="back-step-one">← 返回上一步</button><button class="primary" id="finish-plan">完成今日计划 ✓</button></div>
        </div>
      </section>

      <aside class="panel side-panel">
        <div class="side-title"><div><div class="eyebrow" style="margin-bottom:8px">TODAY / 记录</div><h2>今日清单</h2></div><span id="task-total">0 件事项</span></div>
        <div class="progress-wrap"><div class="progress-label"><strong id="progress-number">0%</strong><span>完成进度</span></div><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div></div>
        <div id="plan-summary" class="plan-summary"><div class="summary-empty">完成第二步后，<br>你的今日清单会出现在这里。</div></div>
        <div class="save-note">每次勾选都会自动保存到本地</div>
      </aside>
    </div>
  </main>

  <div class="modal-backdrop" id="note-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">给这件完成的小事留个备注</h3>
      <p>先写下想记录的内容，再添加截图或任意文件。</p>
      <textarea id="note-text" class="note-textarea" placeholder="在这里直接输入备注……" maxlength="2000"></textarea>
      <div class="file-tools">
        <label class="file-drop" for="file-input" title="添加文件"><strong>＋</strong></label>
        <input id="file-input" type="file" multiple hidden />
        <div id="file-list" class="file-list"></div>
      </div>
      <div class="modal-actions"><button class="secondary" id="skip-note">暂时不要</button><button class="primary" id="save-note">保存备注</button></div>
    </div>
  </div>
  <div class="toast" id="toast">已保存</div>

  <script>
    const STORAGE_KEY = 'penguin-daily-plan-v1';
    const $ = (id) => document.getElementById(id);
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
      story: '', groups: [{ name: '今天要做的事', tasks: [{ text: '', done: false, note: '', files: [] }] }]
    };
    state.groups = (state.groups || []).map(group => ({
      name: group.name || '',
      tasks: (group.tasks || []).map(task => ({
        text: task.text || '',
        done: Boolean(task.done),
        note: task.note || '',
        files: Array.isArray(task.files) ? task.files.map(file => typeof file === 'string' ? ({ id: '', name: file, type: '', size: 0 }) : ({
          id: file.id || '', name: file.name || '未命名文件', type: file.type || '', size: Number(file.size) || 0
        })) : []
      }))
    }));
    if (!state.groups.length) state.groups = [{ name: '今天要做的事', tasks: [{ text: '', done: false, note: '', files: [] }] }];
    let pendingTask = null;
    const HISTORY_LIMIT = 50;
    let historyPast = [];
    let historyFuture = [];
    let editSnapshot = null;

    const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const toast = (message) => { $('toast').textContent = message; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1800); };
    const cloneState = (value = state) => JSON.parse(JSON.stringify(value));
    const sameState = (left, right) => JSON.stringify(left) === JSON.stringify(right);
    const updateHistoryControls = () => {
      $('undo-action').disabled = historyPast.length === 0;
      $('redo-action').disabled = historyFuture.length === 0;
    };
    const addHistorySnapshot = (snapshot) => {
      historyPast.push(cloneState(snapshot));
      if (historyPast.length > HISTORY_LIMIT) historyPast.shift();
      historyFuture = [];
      updateHistoryControls();
    };
    const commitEdit = () => {
      if (!editSnapshot) return;
      const snapshot = editSnapshot;
      editSnapshot = null;
      if (!sameState(snapshot, state)) addHistorySnapshot(snapshot);
    };
    const beginEdit = () => { if (!editSnapshot) editSnapshot = cloneState(); };
    const recordHistory = () => { commitEdit(); addHistorySnapshot(state); };
    const recordChangedHistory = (snapshot) => { commitEdit(); if (!sameState(snapshot, state)) addHistorySnapshot(snapshot); };
    const restoreState = (snapshot) => {
      state = cloneState(snapshot);
      $('story').value = state.story;
      persist();
      renderGroups();
      updateSummary();
      closeNote();
    };
    const undo = () => {
      commitEdit();
      if (!historyPast.length) return;
      historyFuture.push(cloneState());
      restoreState(historyPast.pop());
      updateHistoryControls();
      toast('已撤回上一步');
    };
    const redo = () => {
      commitEdit();
      if (!historyFuture.length) return;
      historyPast.push(cloneState());
      restoreState(historyFuture.pop());
      updateHistoryControls();
      toast('已回到下一步');
    };

    const FILE_DB_NAME = 'penguin-daily-plan-files-v1';
    const FILE_STORE = 'attachments';
    const fileDb = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('当前浏览器不支持本地文件存储'));
      const request = indexedDB.open(FILE_DB_NAME, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(FILE_STORE, { keyPath: 'id' });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('无法打开本地文件存储'));
    });
    const makeFileId = () => window.crypto?.randomUUID?.() || `file-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const saveAttachment = async (file) => {
      const id = makeFileId();
      const db = await fileDb;
      await new Promise((resolve, reject) => {
        const request = db.transaction(FILE_STORE, 'readwrite').objectStore(FILE_STORE).put({ id, name: file.name, type: file.type, size: file.size, blob: file });
        request.onsuccess = resolve;
        request.onerror = () => reject(request.error || new Error('文件保存失败'));
      });
      return { id, name: file.name, type: file.type, size: file.size };
    };
    const readAttachment = async (id) => {
      const db = await fileDb;
      return new Promise((resolve, reject) => {
        const request = db.transaction(FILE_STORE, 'readonly').objectStore(FILE_STORE).get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('文件读取失败'));
      });
    };
    const openStoredFile = async (file) => {
      if (!file.id) return toast('这是旧版本保存的文件名，请重新添加原文件');
      const popup = window.open('', '_blank');
      if (!popup) return toast('浏览器阻止了打开新窗口，请允许弹窗后重试');
      try {
        const stored = await readAttachment(file.id);
        if (!stored?.blob) throw new Error('找不到文件内容');
        const url = URL.createObjectURL(stored.blob);
        popup.location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        popup.close();
        toast('文件内容已丢失，请重新添加原文件');
      }
    };

    const renderGroups = () => {
      const wrap = $('group-builder'); wrap.innerHTML = '';
      state.groups.forEach((group, gi) => {
        const box = document.createElement('div'); box.className = 'group';
        box.innerHTML = `<div class="group-head"><span style="color:#aaa;font-size:12px">${String(gi + 1).padStart(2, '0')}</span><input class="group-name" placeholder="例如：工作 / 生活 / 自我" value="${escapeHtml(group.name)}" aria-label="事项组名称"><button class="group-menu-toggle" title="更多操作" aria-label="更多操作">···</button></div><div class="group-menu"><button class="manage-tasks">显示删除操作</button><button class="delete-group">删除这个事项组</button></div><div class="tasks"></div><button class="add-task">＋ 添加一件小事</button>`;
        const taskBox = box.querySelector('.tasks');
        group.tasks.forEach((task, ti) => {
          const row = document.createElement('div'); row.className = 'task-row' + (task.done ? ' done' : '');
          const noteCount = (task.files || []).length;
          const hasNote = Boolean((task.note || '').trim() || noteCount);
          row.innerHTML = `<input class="check" type="checkbox" ${task.done ? 'checked' : ''} aria-label="完成事项"><input class="task-input" placeholder="写下一件具体的小事" value="${escapeHtml(task.text)}">${hasNote ? '<span class="task-note" title="已添加备注">✎</span>' : ''}<button class="delete-task" title="删除事项" aria-label="删除事项">×</button>`;
          row.querySelector('.check').addEventListener('change', (e) => toggleTask(gi, ti, e.target.checked, row));
          row.querySelector('.task-input').addEventListener('focus', beginEdit);
          row.querySelector('.task-input').addEventListener('input', (e) => { state.groups[gi].tasks[ti].text = e.target.value; persist(); updateSummary(); });
          row.querySelector('.task-input').addEventListener('blur', commitEdit);
          row.querySelector('.delete-task').addEventListener('click', () => { recordHistory(); group.tasks.splice(ti, 1); if (!group.tasks.length) group.tasks.push({ text: '', done: false, note: '', files: [] }); persist(); renderGroups(); updateSummary(); });
          taskBox.appendChild(row);
        });
        box.querySelector('.group-name').addEventListener('focus', beginEdit);
        box.querySelector('.group-name').addEventListener('input', (e) => { state.groups[gi].name = e.target.value; persist(); updateSummary(); });
        box.querySelector('.group-name').addEventListener('blur', commitEdit);
        box.querySelector('.group-menu-toggle').addEventListener('click', (e) => { e.stopPropagation(); document.querySelectorAll('.group.menu-open').forEach(openGroup => { if (openGroup !== box) openGroup.classList.remove('menu-open'); }); box.classList.toggle('menu-open'); });
        box.querySelector('.manage-tasks').addEventListener('click', (event) => { box.classList.toggle('manage-mode'); event.currentTarget.textContent = box.classList.contains('manage-mode') ? '收起删除操作' : '显示删除操作'; box.classList.remove('menu-open'); });
        box.querySelector('.delete-group').addEventListener('click', () => { if (state.groups.length === 1) return toast('至少保留一个事项组'); recordHistory(); state.groups.splice(gi, 1); persist(); renderGroups(); updateSummary(); });
        box.querySelector('.add-task').addEventListener('click', () => { recordHistory(); group.tasks.push({ text: '', done: false, note: '', files: [] }); persist(); renderGroups(); updateSummary(); setTimeout(() => box.querySelector('.tasks .task-row:last-child .task-input')?.focus(), 0); });
        wrap.appendChild(box);
      });
      const add = document.createElement('button'); add.className = 'add-group'; add.textContent = '＋ 新增一个事项组'; add.addEventListener('click', () => { recordHistory(); state.groups.push({ name: '', tasks: [{ text: '', done: false, note: '', files: [] }] }); persist(); renderGroups(); updateSummary(); }); wrap.appendChild(add);
    };
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.group')) document.querySelectorAll('.group.menu-open').forEach(group => group.classList.remove('menu-open'));
    });

    const escapeHtml = (value = '') => value.replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));
    const toggleTask = (gi, ti, checked, row) => { recordHistory(); state.groups[gi].tasks[ti].done = checked; row.classList.toggle('done', checked); persist(); updateSummary(); if (checked) openNote(gi, ti); };
    const updateSummary = () => {
      let total = 0, done = 0; const box = $('plan-summary'); box.innerHTML = '';
      state.groups.forEach((group) => {
        const visible = group.tasks.filter(t => t.text.trim()); if (!visible.length) return;
        const g = document.createElement('div'); g.className = 'summary-group'; const finished = visible.filter(t => t.done).length; total += visible.length; done += finished;
        g.innerHTML = `<div class="summary-group-name"><span>${escapeHtml(group.name || '未命名事项组')}</span><span class="summary-count">${finished}/${visible.length}</span></div>`;
        visible.forEach(task => {
          const taskRow = document.createElement('div'); taskRow.className = 'summary-task-row';
          const t = document.createElement('div'); t.className = 'summary-task' + (task.done ? ' done' : ''); t.textContent = task.text;
          taskRow.append(t); g.appendChild(taskRow);
          if ((task.note || '').trim()) {
            const note = document.createElement('div'); note.className = 'summary-note'; note.textContent = `备注：${task.note.trim()}`; note.title = '点击查看或编辑备注';
            note.addEventListener('click', () => openNoteByReference(task));
            g.appendChild(note);
          }
          if ((task.files || []).length) {
            const files = document.createElement('div'); files.className = 'summary-files';
            (task.files || []).forEach(rawFile => {
              const file = typeof rawFile === 'string' ? { id: '', name: rawFile } : rawFile;
              const fileButton = document.createElement('button'); fileButton.className = 'summary-file'; fileButton.textContent = '●'; fileButton.title = file.name || '未命名文件'; fileButton.setAttribute('aria-label', `打开文件 ${file.name || '未命名文件'}`);
              if (file.id) fileButton.addEventListener('click', () => openStoredFile(file));
              else { fileButton.disabled = true; fileButton.title = `${file.name || '未命名文件'}（旧附件，请重新添加）`; }
              files.appendChild(fileButton);
            });
            g.appendChild(files);
          }
        });
        box.appendChild(g);
      });
      if (!box.children.length) box.innerHTML = '<div class="summary-empty">完成第二步后，<br>你的今日清单会出现在这里。</div>';
      const pct = total ? Math.round(done / total * 100) : 0; $('progress-number').textContent = pct + '%'; $('progress-bar').style.width = pct + '%'; $('task-total').textContent = `${total} 件事项`;
    };
    const hasTaskNote = (task) => Boolean((task.note || '').trim() || (task.files || []).length);
    const openNoteByReference = (task) => {
      for (let gi = 0; gi < state.groups.length; gi += 1) {
        const ti = state.groups[gi].tasks.indexOf(task);
        if (ti !== -1) return openNote(gi, ti);
      }
    };
    const renderFileList = (files = []) => {
      const list = $('file-list'); list.innerHTML = '';
      files.forEach(rawFile => {
        const file = typeof rawFile === 'string' ? { id: '', name: rawFile } : rawFile;
        const item = document.createElement('div'); item.className = 'file-item';
        const name = document.createElement('span'); name.className = 'file-name'; name.textContent = `◌ ${file.name || '未命名文件'}`;
        const open = document.createElement('button'); open.className = 'file-open'; open.textContent = '●'; open.title = file.id ? `打开 ${file.name || '未命名文件'}` : `${file.name || '未命名文件'}（旧附件，请重新添加）`; open.setAttribute('aria-label', open.title); open.disabled = !file.id;
        if (file.id) open.addEventListener('click', () => openStoredFile(file));
        item.append(name, open); list.appendChild(item);
      });
    };
    const openNote = (gi, ti) => {
      pendingTask = { gi, ti };
      const task = state.groups[gi].tasks[ti];
      $('modal-title').textContent = hasTaskNote(task) ? '查看这件事的备注' : '给这件小事留个备注';
      $('note-text').value = task.note || '';
      $('file-input').value = '';
      renderFileList(task.files || []);
      $('note-modal').classList.add('open');
      setTimeout(() => $('note-text').focus(), 0);
    };
    const closeNote = () => { $('note-modal').classList.remove('open'); pendingTask = null; };

    $('story').value = state.story;
    $('story').addEventListener('focus', beginEdit);
    $('story').addEventListener('input', (e) => { state.story = e.target.value; persist(); });
    $('story').addEventListener('blur', commitEdit);
    $('to-step-two').addEventListener('click', () => { commitEdit(); state.story = $('story').value.trim(); persist(); $('step-one').classList.remove('active'); $('step-two').classList.add('active'); renderGroups(); });
    $('back-step-one').addEventListener('click', () => { $('step-two').classList.remove('active'); $('step-one').classList.add('active'); });
    $('finish-plan').addEventListener('click', () => { persist(); toast('今日计划已保存'); updateSummary(); });
    $('undo-action').addEventListener('click', undo);
    $('redo-action').addEventListener('click', redo);
    $('skip-note').addEventListener('click', closeNote);
    $('save-note').addEventListener('click', async () => {
      const saveButton = $('save-note');
      saveButton.disabled = true;
      saveButton.textContent = '保存中…';
      let message = '完成记录已保存';
      try {
        if (pendingTask) {
          const beforeNote = cloneState();
          const task = state.groups[pendingTask.gi].tasks[pendingTask.ti];
          task.note = $('note-text').value.trim();
          const selected = [...$('file-input').files];
          const storedFiles = [];
          for (const file of selected) {
            try { storedFiles.push(await saveAttachment(file)); }
            catch (error) { message = '文字已保存，但部分文件保存失败'; }
          }
          const oldFiles = task.files || [];
          const replacedNames = new Set(storedFiles.map(file => file.name));
          const keptFiles = oldFiles
            .map(file => typeof file === 'string' ? { id: '', name: file } : file)
            .filter(file => file.id || !replacedNames.has(file.name));
          task.files = [...keptFiles, ...storedFiles];
          recordChangedHistory(beforeNote);
          persist();
          renderGroups();
          updateSummary();
        }
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = '保存备注';
        closeNote();
      }
      toast(message);
    });
    $('file-input').addEventListener('change', (e) => {
      const existing = pendingTask ? (state.groups[pendingTask.gi].tasks[pendingTask.ti].files || []) : [];
      renderFileList([...new Set([...existing, ...[...e.target.files].map(file => file.name)])]);
    });
    $('note-modal').addEventListener('click', (e) => { if (e.target === $('note-modal')) closeNote(); });
    $('today').textContent = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date());
    updateSummary();
    updateHistoryControls();
    if (state.story && state.groups.some(g => g.tasks.some(t => t.text))) { $('step-one').classList.remove('active'); $('step-two').classList.add('active'); renderGroups(); }
  </script>
</body>
</html>
